<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning Journey</title>
    <style>
        /* Google Font import kiya hai achhe look ke liye */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000; /* Dark background jab videos play hon */
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* Scroll hide karne ke liye */
            text-align: center;
        }

        .scene {
            display: none; /* By default sab hide rahega */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .active {
            display: flex; /* Jo scene active hoga wo dikhega */
        }

        /* Sun Rising Background CSS */
        .sunrise-bg {
            background: linear-gradient(to top, #ff7e5f, #feb47b);
            color: #fff;
        }

        .sunrise-bg h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        video {
            width: 90%;
            max-height: 70vh;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            background: #111;
        }

        /* Buttons ki styling */
        .btn {
            display: none; /* Time aane par JS isko show karegi */
            margin-top: 25px;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: #007AFF; /* iPhone button blue */
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.4);
            animation: fadeIn 1s;
        }

        .btn-show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Scene 0: Starting Screen -->
    <div id="scene0" class="scene active sunrise-bg">
        <h1>Good Morning ☀️</h1>
        <button class="btn btn-show" onclick="nextScene(1, 'vid1', 12000, 'btn1')">Next</button>
    </div>

    <!-- Scene 1: Video 1 (Wait 12 sec) -->
    <div id="scene1" class="scene">
        <video id="vid1" src="video1.MP4" playsinline></video>
        <button id="btn1" class="btn" onclick="nextScene(2, 'vid2', 23000, 'btn2')">Next</button>
    </div>

    <!-- Scene 2: Video 2 (Wait 23 sec) -->
    <div id="scene2" class="scene">
        <video id="vid2" src="video2.MP4" playsinline></video>
        <button id="btn2" class="btn" onclick="nextScene(3, 'vid3', 23000, 'btn3')">ok lets go for a walk</button>
    </div>

    <!-- Scene 3: Video 3 (Wait 23 sec) -->
    <div id="scene3" class="scene">
        <video id="vid3" src="video3.MP4" playsinline></video>
        <button id="btn3" class="btn" onclick="nextScene(4, 'vid4', 14000, 'btn4')">Next</button>
    </div>

    <!-- Scene 4: Video 4 (Wait 14 sec) -->
    <div id="scene4" class="scene">
        <video id="vid4" src="video4.MP4" playsinline></video>
        <button id="btn4" class="btn" onclick="nextScene(5, 'vid5', 15000, 'btn5')">Next</button>
    </div>

    <!-- Scene 5: Video 5 (Wait 15 sec) -->
    <div id="scene5" class="scene">
        <video id="vid5" src="video5.MP4" playsinline></video>
        <button id="btn5" class="btn" onclick="nextScene(6, 'vid6', 9000, 'btn6')">Next</button>
    </div>

    <!-- Scene 6: Video 6 (Wait 9 sec) -->
    <div id="scene6" class="scene">
        <video id="vid6" src="video6.MP4" playsinline></video>
        <button id="btn6" class="btn" onclick="nextScene(7, 'vid7', 0, null)">The Final One</button>
    </div>

    <!-- Scene 7: Video 7 (Last Video) -->
    <div id="scene7" class="scene">
        <video id="vid7" src="video7.MP4" playsinline></video>
    </div>

    <!-- JavaScript to handle everything automatically -->
    <script>
        function nextScene(nextIndex, vidId, delay, btnId) {
            // Saare scenes ko hide karo
            document.querySelectorAll('.scene').forEach(function(scene) {
                scene.classList.remove('active');
            });

            // Purani videos ko stop/pause karo
            document.querySelectorAll('video').forEach(function(video) {
                video.pause();
                video.currentTime = 0; 
            });

            // Naya scene show karo
            document.getElementById('scene' + nextIndex).classList.add('active');

            // Agar agla scene video wala hai, toh usko play karo
            if (vidId) {
                let videoEl = document.getElementById(vidId);
                videoEl.play().catch(function(error) {
                    console.log("iPhone me autoplay tabhi chalta hai jab user click kare. Lekin button click se trigger ho raha hai, so it will work fine.");
                });

                // Specified seconds baad button show karo
                if (delay > 0 && btnId) {
                    setTimeout(function() {
                        document.getElementById(btnId).classList.add('btn-show');
                    }, delay);
                }
            }
        }
    </script>

</body>
</html>
